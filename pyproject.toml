[project]
name = "slack-stats"
version = "0.1.0"
description = "Slack の自分の発言数・参加チャンネル数などを調べる CLI ツール"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "slack-sdk>=3.27",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
slack-stats = "slack_stats.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
